services:
  ai-tools:
    build: .
    image: ai-tools:1.0
    container_name: ai-tools
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /data/ai-tools:/app/data
      # 企微配置：挂载覆盖镜像内的模板，改配置不用重新 build 镜像。
      # ⚠️ 启动前必须先准备好这个文件，否则 docker 会把它创建成目录，
      #    容器里拿到一个空目录 → 企微配置读不到（扫码登录会灰掉）。
      #    cp wecom_config.example.json wecom_config.json && 填值
      - ./wecom_config.json:/app/wecom_config.json:ro
      #
      # 企微「可信域名」所有权校验文件（WW_verify_xxx.txt）放这里：
      #   宿主机 /data/ai-tools/webroot/  ←→  容器 /app/data/webroot/
      # 后端从 /app/data/webroot/ 提供根目录文件，把文件丢进宿主机那个目录即刻生效，
      # **不用重新 build 镜像、不用重启容器**。
      # （不能放 web/ —— 那是 build 时 COPY 进镜像的，加文件就得重建镜像。）
      # 目录首次由容器自动创建；之后要放文件请用：
      #   sudo mkdir -p /data/ai-tools/webroot
      #   sudo cp WW_verify_xxx.txt /data/ai-tools/webroot/
